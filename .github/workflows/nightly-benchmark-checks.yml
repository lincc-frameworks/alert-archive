# Checks for the nightly benchmark setup in benchmarks/nightly/. The scripts
# only run on S3DF, so they can't be run here; this catches what can be caught
# before merging: shell mistakes, and pins that don't install together.

name: Nightly benchmark checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'benchmarks/nightly/**'
      - '.github/workflows/nightly-benchmark-checks.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # shellcheck is preinstalled on GitHub's Ubuntu runners.
    - name: Lint the nightly scripts
      run: shellcheck benchmarks/nightly/submit.sh benchmarks/nightly/run.sbatch benchmarks/nightly/rsync-bench.sh

  pins:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    # Resolve the pinned versions without installing them, so a bad pin or a
    # dependency conflict fails here instead of in the next nightly run.
    # On S3DF, dask, astropy, etc. come from the LSST env; here they're
    # resolved from PyPI too, so this also checks the pins work together with
    # current releases of those.
    - name: Check the pinned packages resolve
      run: python -m pip install --dry-run -r benchmarks/nightly/requirements.txt
